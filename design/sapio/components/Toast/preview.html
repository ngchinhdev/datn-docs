<!doctype html>
<html>
<head><meta charset="utf-8"><title>Toast</title></head>
<body>
<div class="sp-pad sp-stack" style="max-width: 420px;">
  <div class="sp-toast" role="status">
    <span class="sp-toast__text">Đã check-in chị Ngọc lúc 10:20.</span>
    <button class="sp-toast__action" type="button">Hoàn tác</button>
  </div>
  <div class="sp-toast" role="status">
    <span class="sp-toast__text">Đã thu 400.000 ₫ tiền mặt. Lịch hẹn hoàn thành.</span>
  </div>
  <div class="sp-toast sp-toast--danger" role="alert">
    <span class="sp-toast__text">Giờ 11:00 vừa có người đặt. Chọn giờ khác.</span>
  </div>
</div>
</body>
</html>
