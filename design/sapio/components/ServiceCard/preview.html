<!-- @dsCard group="Booking" height=300 subtitle="Chọn dịch vụ và biến thể trên trang khách." -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ServiceCard</title></head>
<body>
<div class="sp-pad sp-tenant-may" style="max-width:520px">
  <div class="sp-service">
    <div>
      <div class="sp-service__name">Nhuộm tóc</div>
      <div class="sp-variant__meta">Gồm gội và sấy. Thời gian chờ thuốc đã tính trong thời lượng.</div>
    </div>
    <label class="sp-variant">
      <input type="radio" name="nhuom" id="nhuom-ngan" checked>
      <span><span class="sp-variant__name">Tóc ngắn</span><br><span class="sp-variant__meta">105 phút</span></span>
      <span class="sp-variant__price">500.000 ₫</span>
    </label>
    <label class="sp-variant">
      <input type="radio" name="nhuom" id="nhuom-dai">
      <span><span class="sp-variant__name">Tóc dài</span><br><span class="sp-variant__meta">120 phút</span></span>
      <span class="sp-variant__price">700.000 ₫</span>
    </label>
  </div>
</div>
</body>
</html>
