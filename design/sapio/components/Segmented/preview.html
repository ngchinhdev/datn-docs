<!-- @dsCard group="Actions" height=220 subtitle="Chọn một trong vài lựa chọn: buổi trong ngày, kiểu xem lịch." -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Segmented</title></head>
<body>
<div class="sp-pad sp-stack" style="max-width: 420px;">
  <nav class="sp-segmented" aria-label="Kiểu xem">
    <a class="sp-segmented__item" href="#" aria-current="page">Nhân viên</a>
    <a class="sp-segmented__item" href="#">Tài nguyên</a>
  </nav>
  <div class="sp-tenant-may">
    <div class="sp-segmented sp-segmented--lg sp-segmented--block" role="tablist" aria-label="Buổi">
      <button class="sp-segmented__item" type="button" role="tab" aria-selected="true">Sáng <span class="sp-segmented__count">4</span></button>
      <button class="sp-segmented__item" type="button" role="tab" aria-selected="false">Chiều <span class="sp-segmented__count">19</span></button>
      <button class="sp-segmented__item" type="button" role="tab" aria-selected="false">Tối <span class="sp-segmented__count">10</span></button>
    </div>
  </div>
  <div class="sp-tenant-pawpaw">
    <div class="sp-segmented sp-segmented--lg sp-segmented--block" role="tablist" aria-label="Buổi">
      <button class="sp-segmented__item" type="button" role="tab" aria-selected="false" disabled>Sáng <span class="sp-segmented__count">0</span></button>
      <button class="sp-segmented__item" type="button" role="tab" aria-selected="true">Chiều <span class="sp-segmented__count">6</span></button>
      <button class="sp-segmented__item" type="button" role="tab" aria-selected="false">Tối <span class="sp-segmented__count">2</span></button>
    </div>
  </div>
</div>
</body>
</html>
