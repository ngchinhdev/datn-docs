<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="sp-pad sp-stack">
  <div class="sp-row">
    <button class="sp-btn sp-btn--primary" type="button">Check-in</button>
    <button class="sp-btn sp-btn--secondary" type="button">Đổi giờ</button>
    <button class="sp-btn sp-btn--ghost" type="button">Xem chi tiết</button>
    <button class="sp-btn sp-btn--danger" type="button">Đánh dấu không đến</button>
    <button class="sp-btn sp-btn--secondary sp-btn--sm" type="button">Thu tiền</button>
    <button class="sp-btn sp-btn--primary" type="button" disabled>Lưu</button>
  </div>
  <div class="sp-row">
    <div class="sp-tenant-may"><button class="sp-btn sp-btn--accent sp-btn--lg" type="button">Đặt lịch tại Tóc Mây</button></div>
    <div class="sp-tenant-pawpaw"><button class="sp-btn sp-btn--accent sp-btn--lg" type="button">Đặt lịch cho bé</button></div>
  </div>
</div>
</body>
</html>
