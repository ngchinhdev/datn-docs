<!-- @dsCard group="Forms" height=760 subtitle="Bảng bên cạnh lịch: tạo lịch hẹn, tìm khách, kiểm giờ ngay." -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>SidePanel</title></head>
<body>
<div style="max-width: 400px;">
      <aside class="sp-side" aria-labelledby="new-title">
        <div class="sp-side__head">
          <h2 class="sp-side__title" id="new-title">Tạo lịch hẹn</h2>
          <button type="button" class="sp-icon-btn" aria-label="Đóng"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
        </div>
        <div class="sp-field sp-field--sm">
          <label class="sp-field__label" for="nc-find">Khách</label>
          <div class="sp-field__control"><svg style="margin-left: 12px; color: var(--ink-muted);" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><input id="nc-find" type="search" value="0934 5" autocomplete="off" aria-controls="nc-results"></div>
          <span class="sp-field__help">Tìm theo số điện thoại hoặc tên. Số được chuẩn hóa trước khi tìm (BR-61).</span>
        </div>
        <ul class="sp-pick" id="nc-results" role="listbox" aria-label="Kết quả tìm khách">
          <li><button type="button" class="sp-pick__item" role="option" aria-selected="true"><span class="sp-avatar sp-avatar--sm">LH</span><span><span class="sp-pick__name">Lê Thu Hà</span><span class="sp-pick__meta">0934 567 890 · lần thứ 6 · thợ quen Mai</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></button></li>
          <li><button type="button" class="sp-pick__item" role="option" aria-selected="false"><span class="sp-avatar sp-avatar--sm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" x2="19" y1="8" y2="14"></line><line x1="22" x2="16" y1="11" y2="11"></line></svg></span><span><span class="sp-pick__name">Khách mới với số 0934 5…</span><span class="sp-pick__meta">Nhập đủ số rồi điền tên</span></span><span></span></button></li>
          <li><button type="button" class="sp-pick__item" role="option" aria-selected="false"><span class="sp-avatar sp-avatar--sm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4" r="2"></circle><path d="m9 20 3-6 3 2v6"></path><path d="m6 12 2-4 4-1 3 3 3 1"></path></svg></span><span><span class="sp-pick__name">Khách vãng lai</span><span class="sp-pick__meta">Không cần số điện thoại, ghi là "Khách lẻ"</span></span><span></span></button></li>
        </ul>
        <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px;">
          <div class="sp-field sp-field--sm"><label class="sp-field__label" for="nc-svc">Dịch vụ</label><div class="sp-field__control"><select id="nc-svc"><option selected>Cắt tóc</option><option>Gội sấy</option><option>Nhuộm tóc</option></select></div></div>
          <div class="sp-field sp-field--sm"><label class="sp-field__label" for="nc-var">Biến thể</label><div class="sp-field__control"><select id="nc-var"><option selected>Tóc ngắn · 45 phút</option><option>Tóc dài · 1 giờ</option></select></div></div>
          <div class="sp-field sp-field--sm"><label class="sp-field__label" for="nc-staff">Thợ</label><div class="sp-field__control"><select id="nc-staff"><option>Bất kỳ ai</option><option>Mai</option><option selected>Lan</option><option>Hùng</option></select></div><span class="sp-field__help">Điền sẵn từ cột bạn bấm.</span></div>
          <div class="sp-field sp-field--sm"><label class="sp-field__label" for="nc-time">Giờ bắt đầu</label><div class="sp-field__control"><input id="nc-time" type="text" value="14:00"></div><span class="sp-field__help">Thứ Bảy 07/11. Gõ được giờ lẻ như 14:05 (BR-58).</span></div>
        </div>
        <label class="sp-check"><input type="checkbox"><span>Khách yêu cầu đích danh Lan<span class="sp-check__hint">Đổi người sau này sẽ phải hỏi ý khách (BR-11). Giá theo cấp của Lan.</span></span></label>
        <p class="sp-fit sp-fit--ok" role="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span>Trống: Lan, Ghế 2. Xong lúc 14:45.</span></p>
        <dl class="sp-kv" style="padding: 12px; border-radius: var(--radius-md); background: var(--fill-tonal);">
          <dt>Cắt tóc · Tóc ngắn</dt><dd>150.000 ₫</dd>
          <dt>Cọc</dt><dd>Không cần</dd>
          <dt>Trạng thái</dt><dd>Đã xác nhận ngay</dd>
        </dl>
        <div class="sp-field sp-field--sm"><label class="sp-field__label" for="nc-note">Ghi chú nội bộ <span class="sp-field__optional">(không bắt buộc)</span></label><div class="sp-field__control sp-field__control--area"><textarea id="nc-note" rows="2">Gọi trước 30 phút</textarea></div></div>
        <div class="sp-side__foot">
          <button type="button" class="sp-btn sp-btn--ghost">Hủy</button>
          <button type="button" class="sp-btn sp-btn--primary">Tạo lịch hẹn</button>
        </div>
      </aside>
</div>
</body>
</html>
