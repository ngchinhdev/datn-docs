<!-- @dsCard group="Booking" height=300 subtitle="Chọn ngày và giờ trống, màu theo cơ sở." -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>SlotPicker</title></head>
<body>
<div class="sp-pad sp-stack sp-tenant-pawpaw" style="max-width:520px">
  <div class="heading">Chọn giờ cho bé Mochi</div>
  <div class="sp-dates" role="group" aria-label="Ngày">
    <button class="sp-date" type="button" aria-pressed="true">T7<b>07</b></button>
    <button class="sp-date" type="button" aria-pressed="false">CN<b>08</b></button>
    <button class="sp-date" type="button" aria-pressed="false">T2<b>09</b></button>
    <button class="sp-date" type="button" aria-pressed="false">T3<b>10</b></button>
    <button class="sp-date" type="button" aria-pressed="false">T4<b>11</b></button>
    <button class="sp-date" type="button" aria-pressed="false">T5<b>12</b></button>
    <button class="sp-date" type="button" disabled>T6<b>13</b></button>
  </div>
  <div class="sp-segmented sp-segmented--lg sp-segmented--block" role="tablist" aria-label="Buổi">
    <button class="sp-segmented__item" type="button" role="tab" aria-selected="true">Sáng <span class="sp-segmented__count">4</span></button>
    <button class="sp-segmented__item" type="button" role="tab" aria-selected="false" disabled>Chiều <span class="sp-segmented__count">0</span></button>
    <button class="sp-segmented__item" type="button" role="tab" aria-selected="false">Tối <span class="sp-segmented__count">2</span></button>
  </div>
  <div class="sp-slots" role="tabpanel" aria-label="Giờ trống buổi sáng">
    <button class="sp-slot" type="button" aria-pressed="false">08:30</button>
    <button class="sp-slot" type="button" aria-pressed="true">09:15</button>
    <button class="sp-slot" type="button" aria-pressed="false">10:00</button>
    <button class="sp-slot" type="button" aria-pressed="false">11:30</button>
  </div>
</div>
</body>
</html>
