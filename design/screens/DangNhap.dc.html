<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đăng nhập</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/sapio/tokens.css">
<link rel="stylesheet" href="ds/sapio/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--brand)}a:hover{color:var(--ink)}
</style>
</helmet>
<div data-theme="{{theme}}" class="sp-auth" style="width: 1440px; height: 900px; min-height: 0; overflow: hidden; font-family: var(--font-sans);">
  <header class="sp-auth__top">
    <span class="sp-brand__name">Sapio</span>
    <a href="#" style="font: 600 14px/20px var(--font-sans); text-decoration: none;">Đăng ký cơ sở</a>
  </header>
  <main class="sp-auth__main" style="max-width: 440px; padding-top: 64px;">
    <div>
      <h1 class="sp-auth__title">Đăng nhập</h1>
      <p class="sp-auth__lead">Dành cho chủ cơ sở và nhân viên. Khách đặt lịch đăng nhập trên trang của tiệm bằng mã gửi qua email.</p>
    </div>
    <form class="sp-auth__card" style="gap: 16px;">
        <div class="sp-field "><label class="sp-field__label" for="li-mail">Email</label><div class="sp-field__control"><input id="li-mail" type="email" value="linh.pham@email.vn" autocomplete="email"></div></div>
        <div class="sp-field sp-field--error "><label class="sp-field__label" for="li-pass">Mật khẩu</label><div class="sp-field__control"><input id="li-pass" type="password" value="••••••••••••••••" autocomplete="current-password" aria-describedby="li-pass-err" aria-invalid="true"><button type="button" class="sp-icon-btn" aria-label="Hiện mật khẩu" aria-pressed="false" style="margin-right: 4px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div><span class="sp-field__error" id="li-pass-err">Email hoặc mật khẩu chưa đúng. Còn 2 lần thử, sau đó tạm khóa 15 phút.</span></div>
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
          <label class="sp-check"><input type="checkbox"><span>Giữ đăng nhập trên máy này<span class="sp-check__hint">Không chọn thì đăng xuất khi đóng trình duyệt hoặc sau 12 giờ.</span></span></label>
        </div>
        <button type="submit" class="sp-btn sp-btn--primary" style="height: 48px;">Đăng nhập</button>
        <a href="#" style="align-self: center; font: 500 14px/20px var(--font-sans);">Quên mật khẩu?</a>
    </form>
    <p style="margin: 0; text-align: center; font: 400 14px/20px var(--font-sans); color: var(--ink-muted);">Chưa có cơ sở trên Sapio? <a href="#">Đăng ký, dùng thử 7 ngày</a></p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Giao diện"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
