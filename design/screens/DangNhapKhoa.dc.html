<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đăng nhập · tạm khóa</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/sapio/tokens.css">
<link rel="stylesheet" href="ds/sapio/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--brand)}a:hover{color:var(--ink)}
</style>
</helmet>
<div data-theme="{{theme}}" class="sp-auth" style="width: 390px; height: 844px; min-height: 0; overflow: hidden; font-family: var(--font-sans);">
  <header class="sp-auth__top">
    <span class="sp-brand__name">Sapio</span>
    
  </header>
  <main class="sp-auth__main" style="padding-top: 8px;">
    <div>
      <h1 class="sp-auth__title">Đăng nhập</h1>
    </div>
    <form style="display: flex; flex-direction: column; gap: 16px;">
<div role="alert" style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius-md); background: var(--danger-soft); font: 400 14px/20px var(--font-sans);"><span style="flex: none; display: inline-flex; margin-top: 1px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span><div><strong>Tạm khóa đăng nhập tới 10:35.</strong><br>Mật khẩu sai 5 lần liên tiếp. Đã gửi email báo cho linh.pham@email.vn. Muốn vào ngay thì đặt lại mật khẩu.</div></div>        <div class="sp-field "><label class="sp-field__label" for="lk-mail">Email</label><div class="sp-field__control"><input id="lk-mail" type="email" value="linh.pham@email.vn" autocomplete="email"></div></div>
        <div class="sp-field "><label class="sp-field__label" for="lk-pass">Mật khẩu</label><div class="sp-field__control"><input id="lk-pass" type="password" autocomplete="current-password"><button type="button" class="sp-icon-btn" aria-label="Hiện mật khẩu" aria-pressed="false" style="margin-right: 4px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div></div>
        <button type="submit" class="sp-btn sp-btn--primary" style="height: 48px;" disabled>Đăng nhập lại sau 14:52</button>
        <button type="button" class="sp-btn sp-btn--secondary" style="height: 48px;">Đặt lại mật khẩu</button>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Giao diện"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
