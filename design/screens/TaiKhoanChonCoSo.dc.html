<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Chọn cơ sở</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--brand)}a:hover{text-decoration:underline}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ws-row:hover{background:var(--hover)}
@media (max-width: 899px){.aside-col{display:none !important}}
</style>
</helmet>
<div style="--surface: {{c.surface}}; --raised: {{c.raised}}; --tonal: {{c.tonal}}; --hover: {{c.hover}}; --line: {{c.line}}; --ink: {{c.ink}}; --muted: {{c.muted}}; --brand: {{c.brand}}; --focus: {{c.brand}}; min-height: 100vh; box-sizing: border-box; padding: 16px; display: flex; gap: 16px; background: var(--surface); color: var(--ink); font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif;">

  <div class="aside-col" style="flex: 0 0 46%; max-width: 680px; display: flex;">
    <dc-import name="TaiKhoanMinhHoa" variant="workspace" lang="{{lang}}" hint-size="100%,868px"></dc-import>
  </div>

  <main style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap;">
      <span style="display: inline-flex; align-items: center; gap: 8px; padding: 0 8px; font-size: 14px; line-height: 20px; font-weight: 500;">
        <span style="width: 28px; height: 28px; border-radius: 999px; background: var(--tonal); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;">NL</span>Nguyễn Thị Lan
      </span>
      <button type="button" onClick="{{toggleLang}}" aria-label="{{t.langLabel}}" style="height: 40px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 10px; background: var(--tonal); color: var(--ink); font-size: 13px; line-height: 18px; font-weight: 600; font-family: inherit; cursor: pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20"></path><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        {{langCode}}
      </button>
      <button type="button" onClick="{{toggleTheme}}" aria-label="{{t.themeLabel}}" style="width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: var(--tonal); color: var(--ink); cursor: pointer;">
        <sc-if value="{{isDark}}" hint-placeholder-val="{{false}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
        </sc-if>
        <sc-if value="{{isLight}}" hint-placeholder-val="{{true}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
        </sc-if>
      </button>
    </div>

    <div style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 32px 8px;">
      <div style="width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 18px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <h1 style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: -0.02em;">{{t.title}}</h1>
          <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--muted);">{{t.lead}}</p>
        </div>
        <ul aria-label="{{t.listLabel}}" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px;">
          <sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
            <li>
              <a href="#" class="ws-row" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; background: var(--tonal); color: var(--ink); text-decoration: none;">
                <span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; background: {{row.markBg}}; color: {{row.markFg}}; font-size: 15px; font-weight: 700;">{{row.mono}}</span>
                <span style="flex: 1; min-width: 0;">
                  <span style="display: flex; align-items: center; gap: 8px; font-size: 15px; line-height: 22px; font-weight: 600;">{{row.name}}
                    <sc-if value="{{row.recent}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; line-height: 16px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: {{c.completedSoft}}; color: {{c.completed}};">{{t.recent}}</span></sc-if>
                  </span>
                  <span style="display: block; font-size: 13px; line-height: 18px; color: var(--muted);">{{row.sub}}</span>
                </span>
                <sc-if value="{{row.paused}}" hint-placeholder-val="{{false}}">
                  <span style="font-size: 12px; line-height: 16px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: {{c.noShowSoft}}; color: {{c.noShow}};">{{t.paused}}</span>
                </sc-if>
                <sc-if value="{{row.open}}" hint-placeholder-val="{{true}}">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--muted);"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
                </sc-if>
              </a>
            </li>
          </sc-for>
        </ul>
        <a href="TaiKhoanDangNhap.dc.html" style="align-self: center; font-size: 14px; line-height: 20px; font-weight: 500;">{{t.logout}}</a>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"lang":{"editor":"enum","options":["vi","en"],"default":"vi"},"$preview":{"width":1440,"height":900}}'>
const PALETTE = {
  light: { surface: '#f7f9f8', raised: '#ffffff', tonal: '#eef2f1', hover: '#e3e9e7', line: '#e0e6e4', ink: '#121817', muted: '#56625f', brand: '#1a6650', completed: '#47524f', completedSoft: '#e3e9e7', noShow: '#9a430a', noShowSoft: '#fbeadb',
    marks: [['#f8e5ea', '#a63d57'], ['#ece6f6', '#5b3f99'], ['#e3e9e7', '#47524f']] },
  dark: { surface: '#0f1413', raised: '#161c1b', tonal: '#1d2524', hover: '#27312f', line: '#242d2b', ink: '#edf2f0', muted: '#a2aeaa', brand: '#5cc3a1', completed: '#b5bfbc', completedSoft: '#27312f', noShow: '#f2a466', noShowSoft: '#3a2210',
    marks: [['#3a1922', '#e991a6'], ['#261d3a', '#c3a8f0'], ['#27312f', '#b5bfbc']] }
};
const COPY = {
  vi: { langLabel: 'Đổi ngôn ngữ, đang dùng tiếng Việt', themeLabel: 'Đổi giao diện sáng hoặc tối', title: 'Chọn cơ sở', lead: 'Tài khoản lan@toc-may.vn làm ở 3 cơ sở. Mỗi cơ sở mở ở tab riêng cũng được.', listLabel: 'Cơ sở của bạn', recent: 'Dùng gần nhất', paused: 'Tạm dừng', logout: 'Đăng xuất',
    rows: [['Salon Tóc Mây', 'Chủ cơ sở · Tất cả chi nhánh'], ['Spa Lá Sen', 'Lễ tân · Chi nhánh Quận 1'], ['Salon Mộc', 'Kỹ thuật viên · Cơ sở đang tạm dừng']] },
  en: { langLabel: 'Change language, currently English', themeLabel: 'Switch light or dark theme', title: 'Choose a business', lead: 'lan@toc-may.vn works at 3 businesses. You can open each one in its own tab.', listLabel: 'Your businesses', recent: 'Last used', paused: 'Paused', logout: 'Sign out',
    rows: [['Salon Tóc Mây', 'Owner · All branches'], ['Spa Lá Sen', 'Receptionist · District 1 branch'], ['Salon Mộc', 'Technician · Business is paused']] }
};
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const theme = s.theme || this.props.theme || 'light';
    const lang = s.lang || this.props.lang || 'vi';
    const c = PALETTE[theme];
    const t = COPY[lang];
    const monos = ['M', 'LS', 'Mộ'];
    return {
      c: c,
      t: t,
      lang: lang,
      langCode: lang === 'vi' ? 'VI' : 'EN',
      isDark: theme === 'dark',
      isLight: theme !== 'dark',
      rows: t.rows.map((r, i) => ({
        name: r[0], sub: r[1], mono: monos[i],
        markBg: c.marks[i][0], markFg: c.marks[i][1],
        recent: i === 0, paused: i === 2, open: i !== 2
      })),
      toggleTheme: () => this.setState({ theme: theme === 'dark' ? 'light' : 'dark' }),
      toggleLang: () => this.setState({ lang: lang === 'vi' ? 'en' : 'vi' })
    };
  }
}
</script>
</body>
</html>
