<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Quên mật khẩu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--brand)}a:hover{text-decoration:underline}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (max-width: 899px){.aside-col{display:none !important}}
</style>
</helmet>
<div style="--surface: {{c.surface}}; --raised: {{c.raised}}; --tonal: {{c.tonal}}; --line: {{c.line}}; --line-strong: {{c.lineStrong}}; --ink: {{c.ink}}; --muted: {{c.muted}}; --primary: {{c.primary}}; --on-primary: {{c.onPrimary}}; --brand: {{c.brand}}; --brand-soft: {{c.brandSoft}}; --focus: {{c.brand}}; min-height: 100vh; box-sizing: border-box; padding: 16px; display: flex; gap: 16px; background: var(--surface); color: var(--ink); font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif;">

  <div class="aside-col" style="flex: 0 0 46%; max-width: 680px; display: flex;">
    <dc-import name="TaiKhoanMinhHoa" variant="forgot" lang="{{lang}}" hint-size="100%,868px"></dc-import>
  </div>

  <main style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap;">
      <a href="TaiKhoanDangNhap.dc.html" style="font-size: 14px; line-height: 20px; font-weight: 600; text-decoration: none; color: var(--brand); padding: 10px 12px;">{{t.loginTop}}</a>
      <button type="button" onClick="{{toggleLang}}" aria-label="{{t.langLabel}}" style="height: 40px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 10px; background: var(--tonal); color: var(--ink); font-size: 13px; line-height: 18px; font-weight: 600; font-family: inherit; cursor: pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20"></path><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        {{langCode}}
      </button>
      <button type="button" onClick="{{toggleTheme}}" aria-label="{{t.themeLabel}}" style="width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: var(--tonal); color: var(--ink); cursor: pointer;">
        <sc-if value="{{isDark}}" hint-placeholder-val="{{true}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
        </sc-if>
        <sc-if value="{{isLight}}" hint-placeholder-val="{{false}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
        </sc-if>
      </button>
    </div>

    <div style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 32px 8px;">
      <form style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 18px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <h1 style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: -0.02em;">{{t.title}}</h1>
          <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--muted);">{{t.lead}}</p>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label for="fg-mail" style="font-size: 13px; line-height: 18px; font-weight: 600;">Email</label>
          <input id="fg-mail" type="email" autocomplete="email" value="lan@toc-may.vn" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--raised); color: var(--ink); font-size: 16px; font-family: inherit;">
        </div>
        <div role="status" style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--brand-soft); color: var(--ink); font-size: 14px; line-height: 20px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; color: var(--brand);"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
          <span>{{t.sent}}</span>
        </div>
        <button type="submit" disabled style="height: 48px; border: 0; border-radius: 12px; background: var(--tonal); color: var(--muted); font-size: 15px; line-height: 20px; font-weight: 600; font-family: inherit; font-variant-numeric: tabular-nums;">{{t.resend}}</button>
        <a href="TaiKhoanDangNhap.dc.html" style="align-self: center; font-size: 14px; line-height: 20px; font-weight: 500;">{{t.back}}</a>
      </form>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"dark"},"lang":{"editor":"enum","options":["vi","en"],"default":"vi"},"$preview":{"width":1440,"height":900}}'>
const PALETTE = {
  light: { surface: '#f7f9f8', raised: '#ffffff', tonal: '#eef2f1', line: '#e0e6e4', lineStrong: '#87938f', ink: '#121817', muted: '#56625f', primary: '#1a6650', onPrimary: '#ffffff', brand: '#1a6650', brandSoft: '#e1f0ea' },
  dark: { surface: '#0f1413', raised: '#161c1b', tonal: '#1d2524', line: '#242d2b', lineStrong: '#66736f', ink: '#edf2f0', muted: '#a2aeaa', primary: '#5cc3a1', onPrimary: '#0f1413', brand: '#5cc3a1', brandSoft: '#12302a' }
};
const COPY = {
  vi: { loginTop: 'Đăng nhập', langLabel: 'Đổi ngôn ngữ, đang dùng tiếng Việt', themeLabel: 'Đổi giao diện sáng hoặc tối', title: 'Quên mật khẩu', lead: 'Nhập email đăng nhập. Sapio gửi một link để đặt mật khẩu mới.', sent: 'Nếu email này có tài khoản Sapio, link đặt lại vừa được gửi tới đó. Link dùng được 30 phút và chỉ một lần. Không thấy thì xem thư mục Spam.', resend: 'Gửi lại sau 0:48', back: 'Quay lại đăng nhập' },
  en: { loginTop: 'Sign in', langLabel: 'Change language, currently English', themeLabel: 'Switch light or dark theme', title: 'Forgot password', lead: 'Enter your sign-in email. Sapio sends a link to set a new password.', sent: 'If this email has a Sapio account, a reset link is on its way. The link works for 30 minutes and only once. Check your Spam folder if you don’t see it.', resend: 'Resend in 0:48', back: 'Back to sign in' }
};
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const theme = s.theme || this.props.theme || 'dark';
    const lang = s.lang || this.props.lang || 'vi';
    return {
      c: PALETTE[theme],
      t: COPY[lang],
      lang: lang,
      langCode: lang === 'vi' ? 'VI' : 'EN',
      isDark: theme === 'dark',
      isLight: theme !== 'dark',
      toggleTheme: () => this.setState({ theme: theme === 'dark' ? 'light' : 'dark' }),
      toggleLang: () => this.setState({ lang: lang === 'vi' ? 'en' : 'vi' })
    };
  }
}
</script>
</body>
</html>
