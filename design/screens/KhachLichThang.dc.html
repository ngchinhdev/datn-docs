<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Chọn ngày trên lịch tháng</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/sapio/tokens.css">
<link rel="stylesheet" href="ds/sapio/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--brand)}a:hover{color:var(--ink)}
</style>
</helmet>
<div data-theme="{{theme}}" class="sp-tenant-{{tenant}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: var(--surface); color: var(--ink); font-family: var(--font-sans);">
  <div style="display: flex; flex-direction: column; gap: 18px; padding: 16px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <button type="button" aria-label="Quay lại" class="sp-btn sp-btn--ghost" style="width: 44px; height: 44px; padding: 0; border-radius: 999px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
      </button>
      <div style="display: flex; flex-direction: column;">
        <span style="font-size: 15px; line-height: 20px; font-weight: 600;">Nhuộm tóc · Tóc ngắn</span>
        <span style="font-size: 13px; line-height: 18px; color: var(--ink-muted); font-variant-numeric: tabular-nums;">Salon Tóc Mây · 105 phút · 500.000 ₫</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 20px; background: var(--surface-raised); box-shadow: 0 0 0 1px var(--line), var(--shadow-card);">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 17px; line-height: 24px; font-weight: 600; letter-spacing: -0.01em;">Tháng 11, 2026</span>
        <div style="display: flex; gap: 4px;">
          <button type="button" aria-label="Tháng trước" class="sp-btn sp-btn--ghost" style="width: 44px; height: 44px; padding: 0; border-radius: 999px;" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
          </button>
          <button type="button" aria-label="Tháng sau" class="sp-btn sp-btn--ghost" style="width: 44px; height: 44px; padding: 0; border-radius: 999px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
          </button>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-muted);" aria-hidden="true">
        <span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px;" role="group" aria-label="Ngày trong tháng 11">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="35">
          <button type="button" aria-label="{{d.aria}}" aria-pressed="{{d.pressed}}" disabled="{{d.disabled}}" style="{{d.style}}">
            <span>{{d.label}}</span>
            <span aria-hidden="true" style="{{d.dot}}"></span>
          </button>
        </sc-for>
      </div>
      <div style="display: flex; gap: 16px; font-size: 12px; line-height: 16px; color: var(--ink-muted);">
        <span style="display: flex; align-items: center; gap: 6px;"><span aria-hidden="true" style="width: 5px; height: 5px; border-radius: 999px; background: var(--accent);"></span>Còn giờ trống</span>
        <span>Số mờ: kín lịch hoặc đã qua</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 15px; line-height: 22px; font-weight: 600;">Thứ Bảy, 07/11</span>
      <div style="display: flex; flex-direction: column; gap: 8px;" role="group" aria-label="Giờ trống ngày 07/11">
        <button type="button" class="sp-slot" aria-pressed="false" style="border-radius: 12px; height: 48px;">09:00</button>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
          <button type="button" class="sp-slot" aria-pressed="true" style="border-radius: 12px; height: 48px;">09:45</button>
          <button type="button" class="sp-btn sp-btn--accent" style="height: 48px; border-radius: 12px; box-shadow: inset 0 0 0 1.5px var(--on-accent), var(--shadow-xs);">Tiếp tục</button>
        </div>
        <button type="button" class="sp-slot" aria-pressed="false" style="border-radius: 12px; height: 48px;">10:30</button>
        <button type="button" class="sp-slot" aria-pressed="false" style="border-radius: 12px; height: 48px;">13:15</button>
      </div>
      <span style="font-size: 13px; line-height: 18px; color: var(--ink-muted);">Còn 3 giờ khác buổi chiều. Giờ theo giờ Việt Nam.</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Giao diện"},"tenant":{"editor":"enum","options":["may","pawpaw"],"default":"may","section":"Giao diện"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const full = [13, 20, 27];
    const today = 7;
    const base = 'height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; border-radius: 999px; font: 500 15px/20px var(--font-sans); font-variant-numeric: tabular-nums; cursor: pointer; ';
    const days = [];
    for (let i = 0; i < 6; i++) {
      days.push({ label: '', aria: 'Không có ngày', pressed: 'false', disabled: true, style: base + 'background: transparent; visibility: hidden;', dot: 'width: 5px; height: 5px;' });
    }
    for (let n = 1; n <= 30; n++) {
      const past = n < today;
      const selected = n === today;
      const isFull = full.indexOf(n) !== -1;
      let style = base;
      if (selected) style += 'background: var(--accent); color: var(--on-accent); font-weight: 600;';
      else if (past || isFull) style += 'background: transparent; color: var(--ink-muted); opacity: 0.55; cursor: not-allowed;';
      else style += 'background: transparent; color: var(--ink);';
      const showDot = !past && !isFull;
      const dot = 'width: 5px; height: 5px; border-radius: 999px; background: ' + (selected ? 'var(--on-accent)' : 'var(--accent)') + '; visibility: ' + (showDot ? 'visible' : 'hidden') + ';';
      days.push({
        label: String(n),
        aria: 'Ngày ' + n + ' tháng 11' + (isFull ? ', kín lịch' : past ? ', đã qua' : ''),
        pressed: selected ? 'true' : 'false',
        disabled: past || isFull,
        style: style,
        dot: dot,
      });
    }
    return { theme: this.props.dark ? 'dark' : 'light', tenant: this.props.tenant ?? 'may', days: days };
  }
}
</script>
</body>
</html>
